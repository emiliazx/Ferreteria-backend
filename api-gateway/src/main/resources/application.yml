server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://localhost:3000"
              - "http://127.0.0.1:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
        - id: notification-service
          uri: lb://notificaciones
          predicates:
            - Path=/api/notificaciones/**
        - id: ordenes
          uri: lb://ordenes
          predicates:
            - Path=/api/ordenes/**
        - id: pagos
          uri: lb://pagos
          predicates:
            - Path=/api/pagos/**
        - id: productos
          uri: lb://productos
          predicates:
            - Path=/api/productos/**
        - id: carrito
          uri: lb://carrito
          predicates:
            - Path=/api/carritos/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET:FerreteriaMaestrosSecretKey2026MuySeguraParaJWTHS256Tokens}
